<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bibliothèque - Adhérents</title>
    <link rel="stylesheet" href="../styles/style.css">
</head>
<body>

<header>
    <nav aria-label="Navigation principale">
        <div class="logo-container">
            <div class="logo-box">
                <img src="../assets/favicon.ico" alt="logo" width="54" height="54">
            </div>
            <span>Bibliothèque</span>
        </div>

        <ul class="nav-links">
            <li><a href="index.html">Dashboard</a></li>
            <li><a href="auteurs.html">Auteurs</a></li>
            <li><a href="livres.html">Livres</a></li>
            <li><a class="active" href="adherents.html">Adhérents</a></li>
            <li><a href="emprunts.html">Emprunts</a></li>
        </ul>
    </nav>
</header>

<main>
    <section class="page-header">
        <h1>Adhérents</h1>
        <p>Gérer les membres de la bibliothèque</p>
    </section>

    <section class="content-layout">
        <article class="table-section">
            <h2>Liste des adhérents</h2>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nom</th>
                            <th>Contact</th>
                            <th>Actions</th>
                        </tr>
                    </thead>

                    <tbody id="tableAdherents">
                        <!-- fetch() ajoutera les adhérents ici -->
                    </tbody>
                </table>
            </div>
        </article>

        <aside class="form-section">
            <h2>Ajouter / modifier un adhérent</h2>

            <form id="adherent-form">
                <div class="form-group">
                    <label for="adherent-id">ID</label>
                    <input type="number" id="adherent-id" name="id" readonly>
                </div>

                <div class="form-group">
                    <label for="adherent-nom">Nom</label>
                    <input type="text" id="adherent-nom" name="nom" required>
                </div>

                <div class="form-group">
                    <label for="adherent-contact">Contact</label>
                    <input type="text" id="adherent-contact" name="contact" required>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn-primary">Enregistrer</button>
                    <button type="reset" class="btn-secondary">Annuler</button>
                </div>
            </form>
        </aside>
    </section>
</main>

<footer>
    <p>Application de gestion de bibliothèque - &copy; Martonne 2026 All Right Reserved</p>
</footer>

<script src="../js/adherents.js"></script>
</body>
</html>
