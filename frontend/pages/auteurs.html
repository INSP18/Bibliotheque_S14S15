<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bibliothèque - Auteurs</title>
    <link rel="stylesheet" href="../styles/style.css">
</head>
<body>

<header>
    <nav aria-label="Navigation principale">
        <div class="logo-container">
            <div class="logo-box">
                <img src="../assets/favicon.ico" alt="logo" width="54" height="54">
            </div>
            <span>Bibliothèque</span>
        </div>

        <ul class="nav-links">
            <li><a href="index.html">Dashboard</a></li>
            <li><a class="active" href="auteurs.html">Auteurs</a></li>
            <li><a href="livres.html">Livres</a></li>
            <li><a href="adherents.html">Adhérents</a></li>
            <li><a href="emprunts.html">Emprunts</a></li>
        </ul>
    </nav>
</header>

<main>
    <section class="page-header">
        <h1>Auteurs</h1>
        <p>Gérer la liste des auteurs de la bibliothèque</p>
    </section>

    <section class="content-layout">
        <article class="table-section">
            <h2>Liste des auteurs</h2>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nom</th>
                            <th>Livre</th>
                            <th>Nationalité</th>
                            <th>Actions</th>
                        </tr>
                    </thead>

                    <tbody id="tableAuteurs">
                        <!-- fetch() ajoutera les auteurs ici -->
                    </tbody>
                </table>
            </div>
        </article>

        <aside class="form-section">
            <h2>Ajouter / modifier un auteur</h2>

            <form id="auteur-form">
                <div class="form-group">
                    <label for="auteur-id">ID</label>
                    <input type="number" id="auteur-id" name="id" readonly>
                </div>

                <div class="form-group">
                    <label for="auteur-nom">Nom</label>
                    <input type="text" id="auteur-nom" name="nom" required>
                </div>

                <div class="form-group">
                    <label for="auteur-nationalite">Nationalité</label>
                    <input type="text" id="auteur-nationalite" name="nationalite" required>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn-primary">Enregistrer</button>
                    <button type="reset" class="btn-secondary">Annuler</button>
                </div>
            </form>
        </aside>
    </section>
</main>

<footer>
    <p>Application de gestion de bibliothèque - &copy; Martonne 2026 All Right Reserved</p>
</footer>

<script src="../js/auteurs.js"></script>
</body>
</html>
