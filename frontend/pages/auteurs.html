<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auteurs · Bibliothèque</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body data-page="auteurs">
    <div class="shell">
        <aside id="sidebar" class="sidebar"></aside>
        <div class="backdrop" id="backdrop"></div>

        <div class="main">
            <header class="topbar">
                <button type="button" class="btn btn-ghost btn-sm" id="burger">Menu</button>
                <span class="topbar-title">Bibliothèque</span>
            </header>

            <main class="content">
                <header class="page-head">
                    <div>
                        <h1>Auteurs</h1>
                        <p>Les auteurs référencés et leurs livres.</p>
                    </div>
                    <button type="button" class="btn btn-primary" id="btn-nouveau">Nouvel auteur</button>
                </header>

                <section class="card">
                    <div class="toolbar">
                        <input type="search" id="recherche" placeholder="Rechercher un auteur ou une nationalité" aria-label="Rechercher">
                    </div>
                    <div class="table-wrap">
                        <table>
                            <thead>
                                <tr>
                                    <th>N°</th>
                                    <th>Nom</th>
                                    <th>Nationalité</th>
                                    <th>Livres</th>
                                    <th class="col-actions">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="tableAuteurs">
                                <tr><td colspan="5" class="empty">Chargement…</td></tr>
                            </tbody>
                        </table>
                    </div>
                </section>
            </main>
        </div>
    </div>

    <dialog id="modal">
        <form id="auteur-form" class="modal-form">
            <header class="modal-head">
                <h2 id="modal-title">Nouvel auteur</h2>
                <button type="button" class="btn btn-ghost btn-sm" data-close>Fermer</button>
            </header>

            <input type="hidden" id="auteur-id">

            <div class="field">
                <label for="auteur-nom">Nom</label>
                <input type="text" id="auteur-nom" maxlength="200" required>
            </div>
            <div class="field">
                <label for="auteur-nationalite">Nationalité</label>
                <input type="text" id="auteur-nationalite" maxlength="100" required>
            </div>

            <footer class="modal-foot">
                <button type="button" class="btn btn-ghost" data-close>Annuler</button>
                <button type="submit" class="btn btn-primary">Enregistrer</button>
            </footer>
        </form>
    </dialog>

    <div id="toasts" class="toasts" aria-live="polite"></div>

    <script src="../js/common.js"></script>
    <script src="../js/auteurs.js"></script>
</body>
</html>
