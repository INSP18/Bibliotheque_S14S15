<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bibliothèque - Livres</title>
    <link rel="stylesheet" href="../styles/style.css">
</head>
<body>

<header>
    <nav aria-label="Navigation principale">
        <div class="logo-container">
            <div class="logo-box">
                <img src="../assets/favicon.ico" alt="logo" width="54" height="54">
            </div>
            <span>Bibliothèque</span>
        </div>

        <ul class="nav-links">
            <li><a href="index.html">Dashboard</a></li>
            <li><a href="auteurs.html">Auteurs</a></li>
            <li><a class="active" href="livres.html">Livres</a></li>
            <li><a href="adherents.html">Adhérents</a></li>
            <li><a href="emprunts.html">Emprunts</a></li>
        </ul>
    </nav>
</header>

<main>
    <section class="page-header">
        <h1>Livres</h1>
        <p>Gérer les livres disponibles dans la bibliothèque</p>
    </section>

    <section class="content-layout">
        <article class="table-section">
            <h2>Liste des livres</h2>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Titre</th>
                            <th>Statut</th>
                            <th>Année</th>
                            <th>Actions</th>
                        </tr>
                    </thead>

                    <tbody id="tableLivres">
                        <!-- fetch() ajoutera les livres ici -->
                    </tbody>
                </table>
            </div>
        </article>

        <aside class="form-section">
            <h2>Ajouter / modifier un livre</h2>

            <form id="livre-form">
                <div class="form-group">
                    <label for="livre-id">ID</label>
                    <input type="number" id="livre-id" name="id" readonly>
                </div>

                <div class="form-group">
                    <label for="livre-titre">Titre</label>
                    <input type="text" id="livre-titre" name="titre" required>
                </div>

                <div class="form-group">
                    <label for="livre-auteur">Auteur</label>
                    <select id="livre-auteur" name="id_auteur" required>
                        <option value="">Chargement des auteurs…</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="livre-annee">Année de publication</label>
                    <input type="number" id="livre-annee" name="annee_publication" required>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn-primary">Enregistrer</button>
                    <button type="reset" class="btn-secondary">Annuler</button>
                </div>
            </form>
        </aside>
    </section>
</main>

<footer>
    <p>Application de gestion de bibliothèque - &copy; Martonne 2026 All Right Reserved</p>
</footer>

<script src="../js/livres.js"></script>
</body>
</html>
