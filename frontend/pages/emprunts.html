<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emprunts · Bibliothèque</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body data-page="emprunts">
    <div class="shell">
        <aside id="sidebar" class="sidebar"></aside>
        <div class="backdrop" id="backdrop"></div>

        <div class="main">
            <header class="topbar">
                <button type="button" class="btn btn-ghost btn-sm" id="burger">Menu</button>
                <span class="topbar-title">Bibliothèque</span>
            </header>

            <main class="content">
                <header class="page-head">
                    <div>
                        <h1>Emprunts</h1>
                        <p>Enregistrez un emprunt et suivez les retours. La durée de prêt est de 7 jours.</p>
                    </div>
                </header>

                <section class="card">
                    <header class="card-head">
                        <h2>Nouvel emprunt</h2>
                    </header>
                    <form id="emprunt-form" class="inline-form">
                        <div class="field">
                            <label for="emprunt-livre">Livre disponible</label>
                            <select id="emprunt-livre" required>
                                <option value="">Chargement…</option>
                            </select>
                        </div>
                        <div class="field">
                            <label for="emprunt-adherent">Adhérent</label>
                            <select id="emprunt-adherent" required>
                                <option value="">Chargement…</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-primary">Enregistrer l'emprunt</button>
                    </form>
                </section>

                <section class="card">
                    <header class="card-head">
                        <h2>Liste des emprunts</h2>
                        <nav class="tabs" aria-label="Filtrer les emprunts">
                            <button type="button" class="tab active" data-filtre="tous">Tous</button>
                            <button type="button" class="tab" data-filtre="en_cours">En cours</button>
                            <button type="button" class="tab" data-filtre="en_retard">En retard</button>
                            <button type="button" class="tab" data-filtre="rendu">Rendus</button>
                        </nav>
                    </header>
                    <div class="table-wrap">
                        <table>
                            <thead>
                                <tr>
                                    <th>N°</th>
                                    <th>Livre</th>
                                    <th>Adhérent</th>
                                    <th>Emprunté le</th>
                                    <th>Retour prévu</th>
                                    <th>Rendu le</th>
                                    <th>Statut</th>
                                    <th class="col-actions">Action</th>
                                </tr>
                            </thead>
                            <tbody id="tableEmprunts">
                                <tr><td colspan="8" class="empty">Chargement…</td></tr>
                            </tbody>
                        </table>
                    </div>
                </section>
            </main>
        </div>
    </div>

    <div id="toasts" class="toasts" aria-live="polite"></div>

    <script src="../js/common.js"></script>
    <script src="../js/emprunts.js"></script>
</body>
</html>
